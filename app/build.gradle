detekt {
    toolVersion = libs.versions.detekt.get()
    config.setFrom(files("$rootDir/config/detekt/detekt.yml"))
    buildUponDefaultConfig = true
    allRules = false
    ignoreFailures = false
    basePath = rootProject.projectDir
}

tasks.withType(dev.detekt.gradle.Detekt).configureEach {
    exclude("**/build/**")
    exclude("**/generated/**")
    exclude("**/ksp/**")

    reports {
        checkstyle.required.set(true)
        html.required.set(true)
        markdown.required.set(true)
        sarif.required.set(true)
    }
}

def Properties versionProps = new Properties()
def versionPropsFile = file('version.properties')
if (!versionPropsFile.canRead()) {
    throw new GradleException('Could not read version.properties!')
}
versionProps.load(new FileInputStream(versionPropsFile))

def requestedTasks = gradle.startParameter.taskNames.collect { it.tokenize(':').last() }
def isBuildInvocation = requestedTasks.any { taskName ->
    taskName in ['build', 'assemble', 'bundle', 'install'] ||
        taskName ==~ /^(assemble|bundle|install)(Debug|Release)$/
}
def isReleaseInvocation = requestedTasks.any { taskName ->
    taskName in ['build', 'assemble', 'bundle'] ||
        taskName ==~ /^(assemble|bundle|install)Release$/
}

def versionBuild = versionProps['VERSION_BUILD'].toInteger()
if (isBuildInvocation) {
    versionBuild++
    versionProps['VERSION_BUILD'] = versionBuild.toString()
    if (isReleaseInvocation) {
        versionProps['CACHED_VERSION'] = versionBuild.toString()
    }
    versionPropsFile.withOutputStream { output -> versionProps.store(output, null) }
}
def cachedVersion = versionProps['CACHED_VERSION'].toInteger()

android {
    namespace 'ru.svolf.convertx'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId 'ru.svolf.convertx'
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        // Keep debug installs stable; publish each release with the new build number.
        versionCode cachedVersion
        versionName "${versionProps['VERSION_MAJOR']}.${versionProps['VERSION_MINOR']}.${versionProps['VERSION_PATCH']}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            zipAlignEnabled true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        compose true
        viewBinding false
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.buildType == 'release') {
            variant.outputs.each { output ->
                output.versionCode.set(versionBuild)
            }
        }
    }
}

